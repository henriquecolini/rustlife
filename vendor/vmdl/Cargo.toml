# A copy of vmdl 0.2.0 (MIT, https://github.com/icewind1991/vmdl) with one
# change: see ../README.md. Everything else is as published.
[package]
edition = "2021"
rust-version = "1.70.0"
name = "vmdl"
version = "0.2.0"
description = "Rust parser for valve model files."
readme = "README.md"
license = "MIT"
repository = "https://github.com/icewind1991/vmdl"
publish = false

[lib]
name = "vmdl"
path = "src/lib.rs"

[dependencies.arrayvec]
version = "0.7.6"

[dependencies.bitflags]
version = "2.6.0"

[dependencies.bytemuck]
version = "1.17.0"
features = ["derive"]

[dependencies.cgmath]
version = "0.18.0"

[dependencies.half]
version = "2.4.1"

[dependencies.itertools]
version = "0.13.0"

[dependencies.num_enum]
version = "0.7.3"

[dependencies.static_assertions]
version = "1.1.0"

[dependencies.thiserror]
version = "1.0.63"

[dependencies.tracing]
version = "0.1.40"

# The code is upstream's, as published; its style lints are not ours to fix.
[lints.rust]
mismatched_lifetime_syntaxes = "allow"

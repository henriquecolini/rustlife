# cargo-deny configuration: run `cargo deny check`.

# Audit the dependency graph as rustlife actually builds it. We deliberately do
# NOT set `all-features = true`: that would pull in crates' optional *fuzzing*
# features (e.g. `libfuzzer-sys`, licensed NCSA) that we never ship, and fail
# the license check on code that is never compiled into the game.
[graph]

[advisories]
version = 2
yanked = "deny"
# Advisories we have reviewed and consciously accept. Keep this list short, and
# document *why* each one is safe to ignore so the next contributor can re-judge
# it. A *reachable* vulnerability must be fixed, never ignored; an entry is only
# acceptable here when it is unmaintained-only, or a vulnerability in a code
# path rustlife never executes and that upstream controls.
ignore = [
    # `cgmath` is unmaintained (an advisory, not a vulnerability). It reaches us
    # only transitively through `vbsp`/`vbsp-common` (BSP parsing); there is no
    # upgrade available and no way to drop it short of replacing the BSP parser.
    # Revisit if `vbsp` stops depending on it or a real vulnerability is filed.
    "RUSTSEC-2026-0196",
    # `ttf-parser` is unmaintained (an advisory, not a vulnerability). It reaches
    # us only through `winit`'s window decorations (winit -> sctk-adwaita ->
    # ab_glyph), deep in Bevy's windowing stack, with no upgrade available.
    # Revisit when winit's dependency tree drops it.
    "RUSTSEC-2026-0192",
    # `ruzstd` <0.9.1 decompression-bomb OOM (a real vulnerability). It is only
    # reachable when decoding a zstd-supercompressed KTX2 texture from untrusted
    # input; rustlife loads VTF and BSP content exclusively and never decodes
    # KTX2, so this code path is never executed. The decoder is pulled in by
    # Bevy's `3d_api` feature (`zstd_rust`), which bakes it into the 3D feature
    # set, so it cannot be excluded without reconstructing Bevy's whole feature
    # tree. MUST be removed once Bevy bumps `ruzstd` to >=0.9.1; until then the
    # path stays unreachable in rustlife.
    "RUSTSEC-2026-0344",
]

[licenses]
version = 2
# Permissive licenses compatible with distributing rustlife under
# MIT OR Apache-2.0.
allow = [
    "MIT",
    # MIT No Attribution: MIT without the attribution clause, used by Bevy's
    # `encase` dependencies. Strictly more permissive than MIT.
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "BSL-1.0",
    "MPL-2.0",
    # `lzma` (pulled in by `vbsp` to decompress BSP lumps) is WTFPL, which is
    # FSF-approved and strictly more permissive than MIT, so it is compatible
    # with distributing rustlife under MIT OR Apache-2.0.
    "WTFPL",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"

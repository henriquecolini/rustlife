# Tests may unwrap freely; a failing unwrap is a failing test.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-print-in-tests = true

# Domain terms that are proper names, not code identifiers.
doc-valid-idents = ["KeyValues", "OpenMW", "GoldSrc", "DirectX", "..",]

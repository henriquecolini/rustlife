[workspace]
resolver = "3"
members = ["crates/*", "bins/*", "xtask"]
default-members = ["bins/rustlife"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
repository = "https://github.com/henriquecolini/rustlife"
authors = ["Henrique Colini <henriquecolini@gmail.com>"]
publish = false

[workspace.dependencies]
# Internal crates.
rl_assets = { path = "crates/rl_assets" }
rl_client = { path = "crates/rl_client" }
rl_config = { path = "crates/rl_config" }
rl_data = { path = "crates/rl_data" }
rl_level = { path = "crates/rl_level" }
rl_net = { path = "crates/rl_net" }
rl_server = { path = "crates/rl_server" }
rl_sim = { path = "crates/rl_sim" }
source_formats = { path = "crates/source_formats" }
source_fs = { path = "crates/source_fs" }

# External crates.
anyhow = "1"
# The full Bevy engine, used only by the client (rendering, windowing, input).
bevy = { version = "0.20", features = ["wav", "mp3"] }
# Bevy, split into the sub-crates each rustlife crate actually needs so the
# headless server and the format layers don't pull in the full renderer. The
# client crate depends on the umbrella `bevy` crate for rendering.
bevy_animation = "0.20"
bevy_app = "0.20"
bevy_asset = "0.20"
bevy_ecs = "0.20"
# Audio assets only; formats are chosen by the client's `bevy` features.
bevy_audio = { version = "0.20", default-features = false }
bevy_image = "0.20"
bevy_math = "0.20"
bevy_mesh = "0.20"
bevy_reflect = "0.20"
bevy_transform = "0.20"
# Rigid-body physics for props, standalone (no Bevy integration) so the
# simulation stays engine-independent. Pinned to the reviewed upstream
# revision rather than a crates.io release.
box3d-rust = { git = "https://github.com/larsbrubaker/box3d-rust", rev = "f2ca61e39b653d1b13945d13ebd15478d5fa4661" }
futures-lite = "2"
# Vector maths for the simulation; the same major version Bevy uses, so sim
# values cross into rendering without conversion.
glam = "0.33"
criterion = { version = "0.5", default-features = false }
# IEEE half floats, for HDR lightmap texels (Rgba16Float).
half = "2"
# wgpu texture types (Extent3d/TextureFormat/...), pinned to the major version
# Bevy's `bevy_image` uses so the `Image::new` argument types unify.
wgpu-types = { version = "30", default-features = false }
clap = { version = "4", features = ["derive"] }
crc32fast = "1"
directories = "6"
memmap2 = "0.9"
proptest = "1"
# Compact binary encoding of network messages (serde).
postcard = { version = "1", default-features = false, features = ["use-std"] }
# Networking: renet's connection and channel layer, over netcode's UDP
# transport. Both are engine-agnostic; rustlife drives them itself.
renet = "2"
renet_netcode = "2"
ron = "0.12"
serde = { version = "1", features = ["derive"] }
tempfile = "3"
thiserror = "2"
# Source-engine format parsers (wrapped and gap-filled by `source_formats`).
vbsp = "0.9"
vmdl = "0.2"
vmt-parser = "0.2"
vtf = "0.4"
# WESL, the shader language Bevy compiles; the version it uses, so the
# client's tests parse its shaders as Bevy will.
wesl = { version = "0.6", default-features = false }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zip = { version = "9", default-features = false, features = ["deflate"] }

[workspace.lints.rust]
missing_docs = "warn"
unreachable_pub = "warn"
unsafe_op_in_unsafe_fn = "deny"
unused_qualifications = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Pedantic lints we deliberately allow, with the reasoning kept here so it is
# visible to every contributor:
# - module_name_repetitions: `vpk::VpkArchive` reads better than `vpk::Archive`
#   once re-exported at the crate root.
module_name_repetitions = "allow"
# - cast_*: binary formats are full of fixed-width integer conversions; every
#   such cast is reviewed at the parse site and checked with `try_from` where a
#   value can actually overflow.
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
# - Bevy systems take many `Query`/`Res` parameters by value by design.
needless_pass_by_value = "allow"
too_many_arguments = "allow"
# - assert_is_empty: `assert!(x.is_empty())` reads naturally in tests and the
#   suggested `assert_eq!(x, [] as [T; 0])` is noisier than the benefit.
assert_is_empty = "allow"
# Robustness: library code must report errors instead of panicking.
unwrap_used = "deny"
expect_used = "warn"
panic = "deny"
dbg_macro = "deny"
todo = "deny"
print_stdout = "warn"
print_stderr = "warn"

[profile.dev]
# Bevy is painfully slow unoptimised; optimise dependencies but keep our own
# code quick to compile and debuggable.
opt-level = 1
# Line tables are enough to read a backtrace; full debug info is most of the
# link time and target size of every test binary.
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
# Dependencies' debug info is most of what each (Bevy-sized) test binary
# weighs, and is rarely stepped into; leaving it out keeps `target/` to a
# fraction of the size.
debug = false
# Our own code keeps debug assertions; dependencies do not pay for them.
debug-assertions = false
overflow-checks = false

[profile.dev.build-override]
# Build scripts and procedural macros run on every build; compiling them
# optimised makes large derive-heavy crates like Bevy build faster.
opt-level = 3

[profile.release]
# Day-to-day release builds skip LTO: it dominates the link time, and
# `dist` below keeps the fully optimised build for shipping.
codegen-units = 16

[profile.dist]
inherits = "release"
lto = "thin"
codegen-units = 1

[profile.release.build-override]
# Keep build-time tools at the same optimisation as release, so switching
# profiles reuses their compiled artifacts.
opt-level = 3
